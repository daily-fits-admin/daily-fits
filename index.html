<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fights in Tight Spaces - Daily Leaderboard</title>
    
    <!-- Bootstrap CSS (lightweight CDN) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-ENjdO4Dr2bkBIFxQpeoA6VZbA6Y9VdKZc+3ZxZ9l+Il0h5Vx1KkNf0Wl5y2vI5Vx" crossorigin="anonymous">

    <!-- Tabulator CSS -->
    <link href="https://unpkg.com/tabulator-tables@5.5/dist/css/tabulator_midnight.min.css" rel="stylesheet">
    
    <!-- Alpine.js -->
    <script defer src="https://unpkg.com/alpinejs@3.13.3/dist/cdn.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e1e2e 0%, #2d2d44 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
        }
        
        header h1 {
            font-size: 2.5em;
            color: #fff;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }
        
        header p {
            color: #aaa;
            font-size: 1.1em;
        }
        
        .controls {
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .controls label {
            font-weight: 600;
            margin-right: 5px;
        }
        
        .controls input[type="date"],
        .controls select {
            padding: 8px 12px;
            border: 1px solid #444;
            background: #2d2d44;
            color: #fff;
            border-radius: 5px;
            font-size: 1em;
        }
        
        .controls button {
            padding: 8px 20px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            transition: background 0.3s;
        }
        
        .controls button:hover {
            background: #45a049;
        }
        
        .controls button:disabled {
            background: #666;
            cursor: not-allowed;
        }
        
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .tabs button {
            flex: 1;
            min-width: 140px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            color: #aaa;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .tabs button:hover {
            background: rgba(0, 0, 0, 0.4);
            color: #fff;
        }
        
        .tabs button.active {
            background: #4CAF50;
            color: #fff;
        }
        
        .status {
            padding: 10px 15px;
            border-radius: 5px;
            margin-left: auto;
        }
        
        .status.loading {
            background: #ff9800;
            color: #000;
        }
        
        .status.success {
            background: #4CAF50;
        }
        
        .status.error {
            background: #f44336;
        }
        
        #leaderboard-table {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            overflow: hidden;
        }
        
        .tabulator {
            background: transparent;
            border: none;
        }
        
        .tabulator .tabulator-header {
            background: rgba(0, 0, 0, 0.5);
            border-bottom: 2px solid #4CAF50;
        }
        
        .tabulator .tabulator-header .tabulator-col {
            background: transparent;
        }
        
        footer {
            text-align: center;
            margin-top: 40px;
            padding: 20px;
            color: #888;
            font-size: 0.9em;
        }
    </style>

    <!-- Custom lightweight theme overrides -->
    <link rel="stylesheet" href="frontend/css/custom.css">
</head>
<body>
    <div class="container" x-data="leaderboardApp()">
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark rounded mb-3">
            <div class="container-fluid">
                <a class="navbar-brand d-flex align-items-center" href="#">
                    <img src="frontend/assets/logo.svg" alt="logo" width="36" height="36" class="me-2">
                    <span>FITS Leaderboard</span>
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                        <li class="nav-item"><a class="nav-link" href="#">About</a></li>
                        <li class="nav-item"><a class="nav-link" href="#">Docs</a></li>
                    </ul>
                </div>
            </div>
        </nav>

        <div class="hero mb-3" style="background-image: url('frontend/assets/hero.svg');">
            <div class="container py-3">
                <div class="row align-items-center">
                    <div class="col-md-8">
                        <h1 class="display-5">🥊 Fights in Tight Spaces</h1>
                        <p class="lead text-muted">Daily Challenge Leaderboard</p>
                    </div>
                    <div class="col-md-4 text-md-end d-none d-md-block">
                        <img src="frontend/assets/hero-logo.svg" alt="" class="img-fluid" style="max-height:80px">
                    </div>
                </div>
            </div>
        </div>
        
        <div class="tabs">
            <button @click="viewMode = 'daily'" :class="{'active': viewMode === 'daily'}">
                📅 Daily
            </button>
            <button @click="viewMode = 'weekly'; loadWeekly()" :class="{'active': viewMode === 'weekly'}">
                📊 Weekly
            </button>
            <button @click="viewMode = 'monthly'; loadMonthly()" :class="{'active': viewMode === 'monthly'}">
                📆 Monthly
            </button>
            <button @click="viewMode = 'alltime'; loadAllTime()" :class="{'active': viewMode === 'alltime'}">
                🏆 All-Time
            </button>
        </div>
        
        <div class="card mb-3" x-show="viewMode === 'daily'">
            <div class="card-body controls">
                <form class="row g-2 align-items-center">
                    <div class="col-auto">
                        <label for="date-select" class="form-label mb-0">Date</label>
                        <input type="date" id="date-select" x-model="selectedDate" :max="today" class="form-control">
                    </div>
                    <div class="col-auto">
                        <label class="form-label mb-0" aria-hidden="true">&nbsp;</label>
                        <button class="btn btn-success" @click.prevent="loadLeaderboard()" :disabled="loading">
                            <span x-show="!loading">Load</span>
                            <span x-show="loading">Loading...</span>
                        </button>
                    </div>
                    <div class="col-auto ms-auto">
                        <div class="status" x-show="status" :class="statusType" x-text="status"></div>
                    </div>
                </form>
            </div>
        </div>
        
        <div class="card mb-3" x-show="viewMode === 'weekly'">
            <div class="card-body controls">
                <form class="row g-2 align-items-center">
                    <div class="col-auto">
                        <label for="week-select" class="form-label mb-0">Week</label>
                        <select id="week-select" x-model="selectedWeek" @change="loadWeekly()" class="form-select">
                            <template x-for="week in availableWeeks" :key="week.week_start">
                                <option :value="week.week_start" x-text="week.week_start + ' to ' + week.week_end + ' (' + week.player_count + ' players)'"></option>
                            </template>
                        </select>
                    </div>
                    <div class="col-auto">
                        <label class="form-label mb-0" aria-hidden="true">&nbsp;</label>
                        <button class="btn btn-primary" @click.prevent="loadWeekly()" :disabled="loading">
                            <span x-show="!loading">Refresh</span>
                            <span x-show="loading">Loading...</span>
                        </button>
                    </div>
                    <div class="col-auto ms-auto">
                        <div class="status" x-show="status" :class="statusType" x-text="status"></div>
                    </div>
                </form>
            </div>
        </div>
        
        <div class="card mb-3" x-show="viewMode === 'monthly'">
            <div class="card-body controls">
                <form class="row g-2 align-items-center">
                    <div class="col-auto">
                        <label for="month-select" class="form-label mb-0">Month</label>
                        <select id="month-select" x-model="selectedMonth" @change="loadMonthly()" class="form-select">
                            <template x-for="month in availableMonths" :key="month.month_start">
                                <option :value="month.month_start.substring(0, 7)" x-text="formatMonthName(month.month_start) + ' (' + month.player_count + ' players)'"></option>
                            </template>
                        </select>
                    </div>
                    <div class="col-auto">
                        <label class="form-label mb-0" aria-hidden="true">&nbsp;</label>
                        <button class="btn btn-primary" @click.prevent="loadMonthly()" :disabled="loading">
                            <span x-show="!loading">Refresh</span>
                            <span x-show="loading">Loading...</span>
                        </button>
                    </div>
                    <div class="col-auto ms-auto">
                        <div class="status" x-show="status" :class="statusType" x-text="status"></div>
                    </div>
                </form>
            </div>
        </div>
        
        <div class="card mb-3" x-show="viewMode === 'alltime'">
            <div class="card-body controls">
                <div class="d-flex align-items-center">
                    <button class="btn btn-success me-3" @click.prevent="loadAllTime()" :disabled="loading">
                        <span x-show="!loading">Refresh All-Time Stats</span>
                        <span x-show="loading">Loading...</span>
                    </button>
                    <div class="status" x-show="status" :class="statusType" x-text="status"></div>
                </div>
            </div>
        </div>
        
        <div class="card table-card mb-4">
            <div class="card-body p-2">
                <div id="leaderboard-table"></div>
            </div>
        </div>
        
        <footer>
            <p>Unofficial community tool • Not affiliated with Ground Shatter</p>
            <p>Data collected from PlayFab public leaderboards</p>
        </footer>
    </div>
    
    <!-- Tabulator JS -->
    <script src="https://unpkg.com/tabulator-tables@5.5/dist/js/tabulator.min.js"></script>
    <!-- Bootstrap Bundle JS (includes Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-TQ3r8Dk+Y9Qb2a2m5zY9lK9f0Y1y6k1b2VQ1x6y1z9VQ1x6y1z9VQ1x6y1z9VQ" crossorigin="anonymous"></script>
    
    <script>
        function leaderboardApp() {
            return {
                viewMode: 'daily',
                selectedDate: (() => { const d = new Date(); d.setDate(d.getDate() - 1); return d.toISOString().split('T')[0]; })(),
                today: new Date().toISOString().split('T')[0],
                selectedWeek: '',
                selectedMonth: '',
                availableWeeks: [],
                availableMonths: [],
                loading: false,
                status: '',
                statusType: '',
                table: null,
                
                async init() {
                    // Load available weeks and months
                    await Promise.all([
                        this.loadAvailableWeeks(),
                        this.loadAvailableMonths()
                    ]);
                    
                    // Initialize Tabulator with daily columns (rank will display 1-based)
                    this.table = new Tabulator("#leaderboard-table", {
                        layout: "fitColumns",
                        height: "600px",
                        placeholder: "Select a date and click 'Load Leaderboard'",
                        columns: [
                            {
                                title: "Rank",
                                field: "position",
                                width: 80,
                                formatter: (cell) => {
                                    const v = cell.getValue();
                                    const idx = (typeof v === 'number') ? (v + 1) : (Number(v) ? Number(v) + 1 : v);
                                    if (idx === 1) return `🥇 ${idx}`;
                                    if (idx === 2) return `🥈 ${idx}`;
                                    if (idx === 3) return `🥉 ${idx}`;
                                    return idx;
                                }
                            },
                            {
                                title: "Player",
                                field: "display_name",
                                headerFilter: "input",
                                formatter: (cell) => {
                                    return cell.getValue() || '';
                                }
                            },
                            {
                                title: "Score",
                                field: "score",
                                sorter: "number",
                                formatter: (cell) => {
                                    const v = Number(cell.getValue());
                                    return Number.isFinite(v) ? v.toLocaleString() : '';
                                }
                            },
                            {
                                title: "Platform",
                                field: "platform",
                                width: 120,
                                formatter: (cell) => {
                                    return cell.getValue() || '';
                                }
                            },
                            
                        ]
                    });
                    
                    // Auto-load today's leaderboard
                    this.loadLeaderboard();
                },
                
                async loadLeaderboard() {
                    this.loading = true;
                    this.status = 'Loading...';
                    this.statusType = 'loading';
                    
                    console.log('Loading leaderboard for date:', this.selectedDate);
                    
                    try {
                        const url = `frontend/api/leaderboard.php?date=${this.selectedDate}`;
                        console.log('Fetching:', url);
                        
                        const response = await fetch(url);
                        console.log('Response status:', response.status, response.statusText);
                        
                        if (!response.ok) {
                            throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                        }
                        
                        const data = await response.json();
                        console.log('Data received:', data);
                        
                        if (data.success) {
                            // Ensure daily columns are set (restore daily view columns)
                            this.table.setColumns([
                                { title: "Rank", field: "position", width: 80, formatter: (cell) => { const v = cell.getValue(); const idx = (typeof v === 'number') ? (v+1) : (Number(v)?Number(v)+1:v); if (idx===1) return `🥇 ${idx}`; if (idx===2) return `🥈 ${idx}`; if (idx===3) return `🥉 ${idx}`; return idx; } },
                                { title: "Player", field: "display_name", headerFilter: "input", formatter: (cell) => (cell.getValue()||'') },
                                { title: "Score", field: "score", sorter: "number", formatter: (cell) => { const v = Number(cell.getValue()); return Number.isFinite(v)?v.toLocaleString():'' } },
                                { title: "Platform", field: "platform", width: 120, formatter: (cell) => (cell.getValue()||'') },
                            
                            ]);

                            this.table.setData(data.data);
                            this.status = `Loaded ${data.data.length} entries for ${data.meta.date}`;
                            this.statusType = 'success';
                            
                            // Clear status after 3 seconds
                            setTimeout(() => {
                                this.status = '';
                            }, 3000);
                        } else {
                            throw new Error(data.error || 'Failed to load data');
                        }
                    } catch (error) {
                        console.error('Error loading leaderboard:', error);
                        this.status = 'Error: ' + error.message;
                        this.statusType = 'error';
                        this.table.setData([]);
                    } finally {
                        this.loading = false;
                    }
                },
                
                async loadAvailableWeeks() {
                    try {
                        const response = await fetch('frontend/api/weekly.php?list=1');
                        const data = await response.json();
                        if (data.success) {
                            this.availableWeeks = data.data;
                            if (this.availableWeeks.length > 0) {
                                this.selectedWeek = this.availableWeeks[0].week_start;
                            }
                        }
                    } catch (error) {
                        console.error('Error loading available weeks:', error);
                    }
                },
                
                async loadAvailableMonths() {
                    try {
                        const response = await fetch('frontend/api/monthly.php?list=1');
                        const data = await response.json();
                        if (data.success) {
                            this.availableMonths = data.data;
                            if (this.availableMonths.length > 0) {
                                this.selectedMonth = this.availableMonths[0].month_start.substring(0, 7);
                            }
                        }
                    } catch (error) {
                        console.error('Error loading available months:', error);
                    }
                },
                
                formatMonthName(dateStr) {
                    const date = new Date(dateStr);
                    return date.toLocaleDateString('en-US', { year: 'numeric', month: 'long' });
                },
                
                async loadWeekly() {
                    if (!this.selectedWeek) return;
                    
                    this.loading = true;
                    this.status = 'Loading...';
                    this.statusType = 'loading';
                    
                    console.log('Loading weekly leaderboard for:', this.selectedWeek);
                    
                    try {
                        const url = `frontend/api/weekly.php?week=${this.selectedWeek}`;
                        console.log('Fetching:', url);
                        
                        const response = await fetch(url);
                        console.log('Response status:', response.status, response.statusText);
                        
                        if (!response.ok) {
                            throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                        }
                        
                        const data = await response.json();
                        console.log('Data received:', data);
                        
                        if (data.success) {
                            // Update table columns for weekly view
                            this.table.setColumns([
                                { title: "Rank", field: "position", width: 80, formatter: (cell) => { const v = cell.getValue(); const idx = (typeof v === 'number') ? (v + 1) : (Number(v) ? Number(v) + 1 : v); if (idx === 1) return `🥇 ${idx}`; if (idx === 2) return `🥈 ${idx}`; if (idx === 3) return `🥉 ${idx}`; return idx; } },
                                { title: "Player", field: "display_name", headerFilter: "input" },
                                { title: "Total Score", field: "total_score", sorter: "number" },
                                { title: "Days", field: "days_participated", sorter: "number", width: 80 },
                                { title: "Avg Score", field: "average_score", sorter: "number" },
                                { title: "Best Daily", field: "best_daily_score", sorter: "number" },
                                { title: "Best Date", field: "best_daily_date", width: 110 },
                                { title: "Platform", field: "platform", width: 120 },
                                { title: "First Seen", field: "first_seen", width: 110 },
                            ]);
                            
                            this.table.setData(data.data);
                            this.status = `Loaded ${data.data.length} players for ${data.meta.week_start} to ${data.meta.week_end}`;
                            this.statusType = 'success';
                            
                            setTimeout(() => {
                                this.status = '';
                            }, 3000);
                        } else {
                            throw new Error(data.error || 'Failed to load data');
                        }
                    } catch (error) {
                        console.error('Error loading weekly leaderboard:', error);
                        this.status = 'Error: ' + error.message;
                        this.statusType = 'error';
                        this.table.setData([]);
                    } finally {
                        this.loading = false;
                    }
                },
                
                async loadMonthly() {
                    if (!this.selectedMonth) return;
                    
                    this.loading = true;
                    this.status = 'Loading...';
                    this.statusType = 'loading';
                    
                    console.log('Loading monthly leaderboard for:', this.selectedMonth);
                    
                    try {
                        const url = `frontend/api/monthly.php?month=${this.selectedMonth}`;
                        console.log('Fetching:', url);
                        
                        const response = await fetch(url);
                        console.log('Response status:', response.status, response.statusText);
                        
                        if (!response.ok) {
                            throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                        }
                        
                        const data = await response.json();
                        console.log('Data received:', data);
                        
                        if (data.success) {
                            // Update table columns for monthly view
                            this.table.setColumns([
                                { title: "Rank", field: "position", width: 80, formatter: (cell) => { const v = cell.getValue(); const idx = (typeof v === 'number') ? (v + 1) : (Number(v) ? Number(v) + 1 : v); if (idx === 1) return `🥇 ${idx}`; if (idx === 2) return `🥈 ${idx}`; if (idx === 3) return `🥉 ${idx}`; return idx; } },
                                { title: "Player", field: "display_name", headerFilter: "input" },
                                { title: "Total Score", field: "total_score", sorter: "number" },
                                { title: "Days", field: "days_participated", sorter: "number", width: 80 },
                                { title: "Avg Score", field: "average_score", sorter: "number" },
                                { title: "Best Daily", field: "best_daily_score", sorter: "number" },
                                { title: "Best Date", field: "best_daily_date", width: 110 },
                                { title: "Platform", field: "platform", width: 120 },
                            ]);
                            
                            this.table.setData(data.data);
                            this.status = `Loaded ${data.data.length} players for ${data.meta.month_name}`;
                            this.statusType = 'success';
                            
                            setTimeout(() => {
                                this.status = '';
                            }, 3000);
                        } else {
                            throw new Error(data.error || 'Failed to load data');
                        }
                    } catch (error) {
                        console.error('Error loading monthly leaderboard:', error);
                        this.status = 'Error: ' + error.message;
                        this.statusType = 'error';
                        this.table.setData([]);
                    } finally {
                        this.loading = false;
                    }
                },
                
                async loadAllTime() {
                    this.loading = true;
                    this.status = 'Loading...';
                    this.statusType = 'loading';
                    
                    console.log('Loading all-time leaderboard');
                    
                    try {
                        const url = 'frontend/api/alltime.php';
                        console.log('Fetching:', url);
                        
                        const response = await fetch(url);
                        console.log('Response status:', response.status, response.statusText);
                        
                        if (!response.ok) {
                            throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                        }
                        
                        const data = await response.json();
                        console.log('Data received:', data);
                        
                        if (data.success) {
                            // Update table columns for all-time view
                            this.table.setColumns([
                                { title: "Rank", field: "position", width: 80, formatter: (cell) => { const v = cell.getValue(); const idx = (typeof v === 'number') ? (v + 1) : (Number(v) ? Number(v) + 1 : v); if (idx === 1) return `🥇 ${idx}`; if (idx === 2) return `🥈 ${idx}`; if (idx === 3) return `🥉 ${idx}`; return idx; } },
                                { title: "Player", field: "display_name", headerFilter: "input" },
                                { title: "Total Score", field: "total_score", sorter: "number" },
                                { title: "Days", field: "days_participated", sorter: "number", width: 80 },
                                { title: "Avg Score", field: "average_score", sorter: "number" },
                                { title: "Best Daily", field: "best_daily_score", sorter: "number" },
                                { title: "Best Date", field: "best_daily_date", width: 110 },
                                { title: "Platform", field: "platform", width: 120 },
                            ]);
                            
                            this.table.setData(data.data);
                            const meta = data.meta;
                            this.status = `Loaded ${meta.total_players} players (${meta.first_date} to ${meta.last_date})`;
                            this.statusType = 'success';
                            
                            setTimeout(() => {
                                this.status = '';
                            }, 4000);
                        } else {
                            throw new Error(data.error || 'Failed to load data');
                        }
                    } catch (error) {
                        console.error('Error loading all-time leaderboard:', error);
                        this.status = 'Error: ' + error.message;
                        this.statusType = 'error';
                        this.table.setData([]);
                    } finally {
                        this.loading = false;
                    }
                }
            }
        }
    </script>
</body>
</html>
